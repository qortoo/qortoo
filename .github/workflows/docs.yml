name: Documentation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out website
        uses: actions/checkout@v7
        with:
          path: site
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Pin npm version
        run: npm install --global npm@11.20.0
      - name: Read SDK source configuration
        id: sources
        run: |
          node --input-type=module <<'JS'
          import config from './docs-sources.json' with { type: 'json' };
          import { appendFileSync } from 'node:fs';
          for (const source of config.sources) {
            if (!['rust', 'go'].includes(source.id) || /[\r\n]/.test(source.ref + source.repository)) throw new Error('Invalid SDK source');
            appendFileSync(process.env.GITHUB_OUTPUT, `${source.id}-repository=${source.repository}\n${source.id}-ref=${source.ref}\n`);
          }
          JS
      - name: Check out Rust SDK
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.sources.outputs.rust-repository }}
          ref: ${{ steps.sources.outputs.rust-ref }}
          path: qortoo-rs
          persist-credentials: false
      - name: Check out Go SDK
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.sources.outputs.go-repository }}
          ref: ${{ steps.sources.outputs.go-ref }}
          path: qortoo-go
          persist-credentials: false
      - name: Install dependencies
        run: npm ci
      - name: Check document transformations
        run: npm test
      - name: Build with SDK asset fixtures
        run: npm run check:fixture
      - name: Build SDK documentation
        run: npm run build
      - name: Check types
        run: npm run check:types
      - name: Check exported pages and links
        run: npm run check:export
