name: Documentation

on:
  pull_request:
    branches: [main]
    # Operational docs and repository metadata are not published site inputs.
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'LICENSE'
      - '.github/CODEOWNERS'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/assign-author.yml'
  push:
    branches: [main]
    # Operational docs and repository metadata are not published site inputs.
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'LICENSE'
      - '.github/CODEOWNERS'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/assign-author.yml'
  workflow_dispatch:
    inputs:
      candidate_sdk:
        description: Validate an SDK candidate without publishing (none refreshes main)
        type: choice
        options: [none, rust, go]
        default: none
      candidate_repository:
        description: Candidate owner/repository, including a fork
        type: string
        default: ''
      candidate_sha:
        description: Full candidate commit SHA
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}-${{ (inputs.candidate_sdk == 'rust' || inputs.candidate_sdk == 'go') && format('candidate-{0}-{1}', inputs.candidate_sdk, inputs.candidate_sha) || 'publication' }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build-docs.yml
    with:
      site_ref: ${{ github.sha }}
      candidate_sdk: ${{ inputs.candidate_sdk != 'none' && inputs.candidate_sdk || '' }}
      candidate_repository: ${{ inputs.candidate_repository || '' }}
      candidate_sha: ${{ inputs.candidate_sha || '' }}
      upload_pages: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (inputs.candidate_sdk == '' || inputs.candidate_sdk == 'none') }}

  deploy:
    if: needs.build.outputs.built == 'true' && github.repository == 'qortoo/qortoo' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (inputs.candidate_sdk == '' || inputs.candidate_sdk == 'none')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify public documentation revisions
        uses: actions/github-script@v8
        env:
          DOCS_INPUTS: ${{ needs.build.outputs.inputs }}
        with:
          script: |
            const expected = JSON.parse(process.env.DOCS_INPUTS);
            const url = `https://qortoo.github.io/qortoo/generated/sources.json?run=${context.runId}&attempt=${context.runAttempt}`;
            for (let attempt = 0; attempt < 6; attempt++) {
              try {
                const response = await fetch(url, { cache: 'no-store', signal: AbortSignal.timeout(15000) });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const actual = await response.json();
                const matches = actual.mode === 'committed' && !actual.site.dirty && actual.site.sha === expected.siteSha &&
                  actual.benchmarks?.revision === expected.benchmarks.revision && actual.benchmarks?.indexSha256 === expected.benchmarks.indexSha256 &&
                  Object.entries(expected.sources).every(([id, source]) => {
                    const guide = actual.sources.find(s => s.id === id);
                    return guide?.sha === source.sha && guide?.repository === source.repository && actual.api[id]?.sha === source.sha;
                  });
                if (matches) {
                  const performance = await fetch(`https://qortoo.github.io/qortoo/docs/performance/?run=${context.runId}`, { cache: 'no-store', signal: AbortSignal.timeout(15000) });
                  const html = await performance.text();
                  if (!performance.ok || !html.includes(expected.benchmarks.revision)) throw new Error('Public Performance page does not match benchmark snapshot');
                  core.info('Public guides, APIs, and benchmark results match the resolved inputs.');
                  return;
                }
                core.info('Waiting for the public manifest to match the deployment.');
              } catch (error) {
                core.info(`Public manifest not ready: ${error.message}`);
              }
              if (attempt < 5) await new Promise(resolve => setTimeout(resolve, 10000));
            }
            core.setFailed('Public documentation revisions do not match the validated build.');
